x-storage-env: &storage-env
  DATABASE_URL: postgres://${POSTGRES_USER:-agents}:${POSTGRES_PASSWORD:-agents}@postgres:5432/${POSTGRES_DB:-agents}
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: ${S3_BUCKET:-agents-documents}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}

x-provider-env: &provider-env
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}

x-node-health: &node-health
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 15s

x-node-health-4100: &node-health-4100
  test: ["CMD", "node", "-e", "fetch('http://localhost:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  <<: *node-health
x-node-health-4101: &node-health-4101
  test: ["CMD", "node", "-e", "fetch('http://localhost:4101/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  <<: *node-health
x-node-health-4102: &node-health-4102
  test: ["CMD", "node", "-e", "fetch('http://localhost:4102/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  <<: *node-health

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agents}
      POSTGRES_DB: ${POSTGRES_DB:-agents}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  minio:
    # minio/minio is no longer published on Docker Hub; the bitnamilegacy mirror is.
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  minio-init:
    image: bitnamilegacy/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-agents-documents}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing "local/$$S3_BUCKET"
    restart: "no"

  llm:
    build: { context: ., target: llm }
    environment:
      <<: *provider-env
    ports:
      - "4102:4102"
    healthcheck: *node-health-4102

  agent:
    build: { context: ., target: agent }
    environment:
      LLM_URL: http://llm:4102
      AGENT_RUNTIME: ${AGENT_RUNTIME:-basic-rag}
    depends_on:
      llm: { condition: service_healthy }
    ports:
      - "4101:4101"
    healthcheck: *node-health-4101

  api:
    build: { context: ., target: api }
    environment:
      <<: *storage-env
      AGENT_URL: http://agent:4101
      TENANT_ID: ${TENANT_ID:-local-tenant}
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      agent: { condition: service_healthy }
    ports:
      - "4100:4100"
    healthcheck: *node-health-4100

  worker:
    build: { context: ., target: worker }
    environment:
      <<: *storage-env
      LLM_URL: http://llm:4102
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      llm: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: { context: ., target: web }
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres_data:
  minio_data:
