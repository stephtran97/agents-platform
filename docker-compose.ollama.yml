# Local Ollama running llama3.2:3b (CPU by default).
#
#   docker compose -f docker-compose.ollama.yml up -d
#
# First start pulls the chat model (~2 GB) and the embedding model nomic-embed-text
# (~270 MB, 768 dimensions) into the `ollama_data` volume; the `ollama-pull` service
# exits when done. Then point the platform at it:
#   LLM_PROVIDER=ollama
#   LLM_BASE_URL=http://host.docker.internal:11434/v1   (from Docker; http://localhost:11434/v1 on host)
#   LLM_MODEL=llama3.2:3b
#   LLM_EMBEDDING_MODEL=nomic-embed-text
#   LLM_TIMEOUT_MS=120000
#
# NVIDIA GPU: uncomment the `deploy` block on the `ollama` service.

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - '${OLLAMA_PORT:-11434}:11434'
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      [
        'sh',
        '-c',
        'ollama pull ${OLLAMA_MODEL:-llama3.2:3b} && ollama pull ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}'
      ]
    restart: 'no'

volumes:
  ollama_data:
